<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Chronos Sync Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Outfit:wght@600;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <style>
        :root {
            --primary: #1a73e8; --bg: #f8f9fa; --card: #ffffff;
            --text: #202124; --text-sub: #5f6368;
            --input-bg: #f1f3f4; --shadow: 0 4px 20px rgba(0,0,0,0.08);
            --danger: #ea4335; --accent: #34a853; 
            --nav-bg: #1e293b; --tab-inactive: #94a3b8; --tab-active: #eab308;
        }
        body.dark-mode {
            --bg: #0f172a; --card: #1e293b; --text: #f8fafc;
            --text-sub: #94a3b8; --input-bg: #334155;
            --shadow: 0 10px 30px rgba(0,0,0,0.3); --nav-bg: #0f172a;
        }
        body {
            font-family: 'Noto Sans JP', sans-serif; background-color: var(--bg);
            color: var(--text); margin: 0; padding: 0; transition: 0.3s;
            display: flex; justify-content: center; overflow-x: hidden;
        }
        .app-shell { width: 100%; max-width: 500px; min-height: 100vh; position: relative; padding-bottom: 250px; }
        header { padding: 20px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; background: var(--bg); z-index: 1000; }
        .brand-wrap { display: flex; align-items: center; gap: 8px; }
        .brand-logo { color: var(--primary); font-size: 28px; }
        .brand-name { font-family: 'Outfit', sans-serif; font-size: 24px; font-weight: 800; color: var(--primary); }
        .header-controls { display: flex; align-items: center; gap: 10px; }
        .header-btn { width: 44px; height: 44px; border-radius: 14px; border: none; background: var(--card); color: var(--text); cursor: pointer; box-shadow: var(--shadow); display: flex; align-items: center; justify-content: center; transition: 0.3s; }
        .header-btn.login-active { border: 3px solid var(--primary); color: var(--primary); background: rgba(26, 115, 232, 0.1); }
        .bottom-nav-container { position: fixed; bottom: 20px; left: 0; width: 100%; display: flex; flex-direction: column; align-items: center; gap: 15px; z-index: 2000; pointer-events: none; }
        .bottom-nav { width: 90%; max-width: 400px; background: var(--nav-bg); display: flex; justify-content: space-around; padding: 12px 5px; border-radius: 28px; box-shadow: 0 10px 30px rgba(0,0,0,0.4); pointer-events: auto; }
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--tab-inactive); cursor: pointer; flex: 1; transition: 0.2s; }
        .nav-item.active { color: var(--tab-active); }
        .nav-item i { font-size: 24px; }
        .nav-item span { font-size: 10px; font-weight: 700; }
        .sync-btn-wrap { width: 100%; display: flex; justify-content: center; pointer-events: auto; }
        .sync-btn { width: 85%; max-width: 360px; padding: 16px; border-radius: 50px; border: none; background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%); color: white; font-size: 16px; font-weight: 800; cursor: pointer; box-shadow: 0 8px 20px rgba(79, 172, 254, 0.4); display: none; }
        .sync-btn.visible { display: block; }
        .page { display: none; padding: 0 15px; }
        .page.active { display: block; }
        .glass-card { background: var(--card); border-radius: 28px; padding: 20px; margin-bottom: 20px; box-shadow: var(--shadow); }
        textarea { width: 100%; height: 150px; border: 1px solid rgba(0,0,0,0.1); outline: none; background: var(--input-bg); border-radius: 18px; padding: 15px; color: var(--text); font-size: 14px; box-sizing: border-box; resize: none; margin-bottom: 15px; }
        .preview-label { font-size: 13px; font-weight: 700; margin-bottom: 12px; display: block; opacity: 0.7; }
        .event-tile { background: var(--input-bg); border-radius: 16px; padding: 12px; margin-bottom: 10px; display: flex; align-items: center; gap: 12px; transition: 0.3s; }
        .tile-time { background: var(--primary); color: white; padding: 4px 8px; border-radius: 8px; font-size: 11px; font-weight: 700; min-width: 45px; text-align: center; }
        .tile-title { flex: 1; font-size: 13px; font-weight: 600; }
        .manage-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .date-input { background: var(--input-bg); border: none; padding: 10px; border-radius: 12px; color: var(--text); font-weight: 700; font-size: 14px; outline: none; }
        .manual-input { width: 100%; padding: 14px; border-radius: 12px; border: none; background: var(--input-bg); color: var(--text); box-sizing: border-box; font-size: 16px; margin-bottom: 12px; }
        #toast { position: fixed; top: 40px; left: 50%; transform: translateX(-50%); background: #202124; color: white; padding: 12px 24px; border-radius: 50px; font-size: 14px; z-index: 3000; display: none; }
    </style>
</head>
<body id="body">

<div id="toast"></div>

<div class="app-shell">
    <header>
        <div class="brand-wrap">
            <i class="material-icons-round brand-logo">auto_awesome</i>
            <span class="brand-name">Chronos Sync</span>
        </div>
        <div class="header-controls">
            <button class="header-btn" onclick="toggleDarkMode()"><i class="material-icons-round" id="themeIcon">dark_mode</i></button>
            <button class="header-btn" id="loginBtn" onclick="handleAuthClick()"><i class="material-icons-round">account_circle</i></button>
        </div>
    </header>

    <div id="page-home" class="page active">
        <div class="glass-card">
            <span class="preview-label">JSONを貼り付け</span>
            <textarea id="jsonInput" placeholder="ここに貼り付け..." oninput="renderPreview()"></textarea>
            <span class="preview-label">プレビュー</span>
            <div id="previewList"></div>
        </div>
    </div>

    <div id="page-history" class="page">
        <div class="glass-card">
            <div class="manage-header">
                <input type="date" id="targetDate" class="date-input">
                <div style="color:var(--danger); font-size:12px; font-weight:800; cursor:pointer;" onclick="bulkDelete()">一括削除</div>
            </div>
            <div id="calendarList"></div>
        </div>
    </div>

    <div id="page-manual" class="page">
        <div class="glass-card">
            <span class="preview-label">予定を個別に追加</span>
            <input type="date" id="mDate" class="manual-input">
            <input type="text" id="mTitle" placeholder="予定のタイトル" class="manual-input">
            <div style="display:flex; gap:10px; margin-bottom: 15px;">
                <input type="time" id="mStart" value="09:00" class="manual-input">
                <input type="time" id="mEnd" value="10:00" class="manual-input">
            </div>
            <button class="sync-btn visible" style="width:100%;" onclick="addManual()">カレンダーに追加</button>
        </div>
    </div>

    <div class="bottom-nav-container">
        <div class="sync-btn-wrap">
            <button id="syncBtn" class="sync-btn visible" onclick="startSync()">Synchronize Now</button>
        </div>
        <nav class="bottom-nav">
            <div class="nav-item" onclick="showPage('history', this)"><i class="material-icons-round">calendar_month</i><span>履歴</span></div>
            <div class="nav-item active" onclick="showPage('home', this)"><i class="material-icons-round">home</i><span>ホーム</span></div>
            <div class="nav-item" onclick="showPage('manual', this)"><i class="material-icons-round">add_task</i><span>個別追加</span></div>
        </nav>
    </div>
</div>

<script async defer src="https://apis.google.com/js/api.js" onload="gapiLoaded()"></script>
<script async defer src="https://accounts.google.com/gsi/client" onload="gisLoaded()"></script>

<script>
    const CLIENT_ID = '521516239634-b45gnhtgaevtrio87si461chmi54gnrt.apps.googleusercontent.com';
    const API_KEY = 'AIzaSyDQYr8hKJYME6ZYY82dgbTjBAQgKVNpe_E';
    const SCOPES = 'https://www.googleapis.com/auth/calendar.events';

    let tokenClient;
    let gapiInited = false;
    let gisInited = false;

    // --- 初期化 ---
    function gapiLoaded() {
        gapi.load('client', async () => {
            await gapi.client.init({
                apiKey: API_KEY,
                discoveryDocs: ["https://www.googleapis.com/discovery/v1/apis/calendar/v3/rest"],
            }).catch(err => console.error("GAPI Init Error:", err));
            gapiInited = true;
            maybeStart();
        });
    }

    function gisLoaded() {
        tokenClient = google.accounts.oauth2.initTokenClient({
            client_id: CLIENT_ID,
            scope: SCOPES,
            callback: (resp) => {
                if (resp.error) return;
                saveToken(resp);
                showToast("ログイン成功");
                fetchCalendar();
            },
        });
        gisInited = true;
        maybeStart();
    }

    function maybeStart() {
        if (gapiInited && gisInited) {
            checkExistingToken();
        }
    }

    // --- ログイン維持ロジック ---
    function checkExistingToken() {
        const stored = localStorage.getItem('gcal_token');
        if (stored) {
            const tokenData = JSON.parse(stored);
            if (Date.now() < tokenData.expires_at) {
                gapi.client.setToken(tokenData.token);
                document.getElementById('loginBtn').classList.add('login-active');
                if(document.getElementById('page-history').classList.contains('active')) fetchCalendar();
            } else {
                localStorage.removeItem('gcal_token');
            }
        }
    }

    function saveToken(resp) {
        const tokenData = {
            token: resp,
            expires_at: Date.now() + (resp.expires_in * 1000)
        };
        localStorage.setItem('gcal_token', JSON.stringify(tokenData));
        gapi.client.setToken(resp);
        document.getElementById('loginBtn').classList.add('login-active');
    }

    window.handleAuthClick = () => {
        tokenClient.requestAccessToken({ prompt: 'consent' });
    };

    // --- API機能 ---
    window.fetchCalendar = async () => {
        if (!gapi.client.calendar) {
            console.log("Calendar API not ready");
            return;
        }
        const dateStr = document.getElementById('targetDate').value;
        try {
            const resp = await gapi.client.calendar.events.list({
                'calendarId': 'primary', 'timeMin': `${dateStr}T00:00:00+09:00`, 'timeMax': `${dateStr}T23:59:59+09:00`,
                'singleEvents': true, 'orderBy': 'startTime'
            });
            const events = resp.result.items || [];
            document.getElementById('calendarList').innerHTML = events.map(ev => {
                const dt = new Date(ev.start.dateTime || ev.start.date);
                const time = ev.start.dateTime ? `${dt.getHours()}:${String(dt.getMinutes()).padStart(2, '0')}` : "終日";
                return `<div class="event-tile">
                    <div class="tile-time">${time}</div>
                    <div class="tile-title">${ev.summary}</div>
                    <i class="material-icons-round" style="color:var(--danger); font-size:18px; cursor:pointer;" onclick="deleteEv('${ev.id}')">delete_outline</i>
                </div>`;
            }).join('') || '<p style="text-align:center; opacity:0.5;">予定なし</p>';
        } catch (e) {
            if (e.status === 401) handleAuthClick();
        }
    };

    window.startSync = async () => {
        const input = document.getElementById('jsonInput').value;
        const items = parseAnyJSON(input);
        if (!items) return showToast("データを確認してください");
        showToast("同期中...");
        try {
            for (const ev of items) {
                await gapi.client.calendar.events.insert({
                    'calendarId': 'primary',
                    'resource': {
                        'summary': ev.title,
                        'start': { 'dateTime': `${ev.date}T${ev.start}:00+09:00`, 'timeZone': 'Asia/Tokyo' },
                        'end': { 'dateTime': ev.end ? `${ev.date}T${ev.end}:00+09:00` : `${ev.date}T${ev.start}:00+09:00`, 'timeZone': 'Asia/Tokyo' }
                    }
                });
            }
            showToast("同期完了！");
            document.getElementById('jsonInput').value = '';
            renderPreview();
        } catch (e) { 
            if(e.status === 401) handleAuthClick();
            else showToast("同期エラー");
        }
    };

    // --- 補助関数 ---
    window.renderPreview = () => {
        const input = document.getElementById('jsonInput').value;
        const list = document.getElementById('previewList');
        if (!input) { list.innerHTML = ''; return; }
        const items = parseAnyJSON(input);
        list.innerHTML = items ? items.map(ev => `<div class="event-tile"><div class="tile-time">${ev.start}</div><div>${ev.title}</div></div>`).join('') : '<p style="color:var(--danger); font-size:12px;">解析エラー</p>';
    };

    function parseAnyJSON(input) {
        try {
            const data = JSON.parse(input);
            let raw = Array.isArray(data) ? data : (data.schedule || data.events || [data]);
            let defaultDate = document.getElementById('targetDate').value;
            return raw.map(i => ({
                title: i.title || i.activity || i.summary || "予定",
                start: i.start || i.time || "09:00",
                end: i.end || "",
                date: i.date || defaultDate
            }));
        } catch (e) { return null; }
    }

    window.showPage = (id, el) => {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        document.getElementById('page-' + id).classList.add('active');
        el.classList.add('active');
        document.getElementById('syncBtn').style.display = (id === 'home') ? 'block' : 'none';
        if(id === 'history') fetchCalendar();
    };

    window.toggleDarkMode = () => {
        document.body.classList.toggle('dark-mode');
        localStorage.setItem('theme', document.body.classList.contains('dark-mode') ? 'dark' : 'light');
    };

    window.showToast = (m) => {
        const t = document.getElementById('toast'); t.innerText = m; t.style.display = 'block';
        setTimeout(() => t.style.display = 'none', 2500);
    };

    // 初期化
    const s = new Date().toISOString().split('T')[0];
    document.getElementById('targetDate').value = s;
    document.getElementById('targetDate').addEventListener('change', fetchCalendar);
    document.getElementById('mDate').value = s;
    if (localStorage.getItem('theme') === 'dark') document.body.classList.add('dark-mode');
</script>
</body>
</html>
